<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>SnapDraw Screen Recorder</title>
  </head>
  <body>
    <main class="sd-rec">
      <header class="sd-rec__header">
        <h1 class="sd-rec__title">Record your screen</h1>
        <p class="sd-rec__subtitle">
          Chrome's screen picker opens automatically. Choose a screen or window there —
          recording continues while this window stays open.
        </p>
      </header>

      <div class="sd-rec__status" id="status" role="status" aria-live="polite">
        <span class="sd-rec__dot sd-rec__dot--working" id="dot" aria-hidden="true"></span>
        <span class="sd-rec__status-text" id="status-text">Opening Chrome's picker…</span>
        <span class="sd-rec__timer" id="timer" aria-hidden="true" hidden>0:00</span>
      </div>

      <p class="sd-rec__error" id="error" role="alert" hidden></p>

      <div class="sd-rec__actions">
        <button
          type="button"
          class="sd-rec__button sd-rec__button--retry"
          id="retry"
          aria-label="Try again to open Chrome's screen picker"
          hidden
        >
          Try again
        </button>
        <button type="button" class="sd-rec__button sd-rec__button--stop" id="stop" hidden>
          Stop and open editor
        </button>
        <button
          type="button"
          class="sd-rec__button sd-rec__button--cancel"
          id="cancel"
          aria-label="Cancel and close the recorder"
          hidden
        >
          Cancel
        </button>
      </div>

      <p class="sd-rec__note">
        SnapDraw saves the recording locally and opens the video editor when you stop.
      </p>
    </main>
    <script type="module" src="./recorder.ts"></script>
  </body>
</html>
